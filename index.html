<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CNCmarketplace</title>
<style>body{margin:0;background:#08090a;color:#eee;font:15px Arial}header{padding:20px 6%;border-bottom:1px solid #282828}.brand{font-size:24px;font-weight:900}.brand b{color:#d6a85f}.hero{padding:70px 6%;background:radial-gradient(circle at 80%,#3a2915,transparent 35%)}.wrap{padding:40px 6%}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#121416;border:1px solid #282a2c;border-radius:9px;overflow:hidden}.pic{height:210px;background:#151719}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:15px}.muted{color:#999}.price{color:#e1bc78;font-weight:bold}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head>
<body><header><div class="brand">CNC<b>marketplace</b></div><a href="/admin" style="color:#aaa">Admin</a></header>
<section class="hero"><h1>Design it. Cut it. Make it real.</h1><p class="muted">CNC-ready digital designs.</p></section><section class="wrap"><h2>Latest designs</h2><div id="grid" class="grid"></div></section>
<script>async function load(){let p=await(await fetch("/api/products")).json();grid.innerHTML=p.map(x=>`<div class="card"><div class="pic">${x.imageUrl?`<img src="${x.imageUrl}" loading="lazy">`:""}</div><div class="body"><small class="muted">${x.format||""} · ${x.category||""}</small><h3>${x.name}</h3><div class="price">${x.premium?"$"+x.price:"FREE"}</div></div></div>`).join("")||"<p>No designs yet.</p>"}load()</script></body></html>
